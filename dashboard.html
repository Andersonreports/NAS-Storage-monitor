<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAS Storage Monitor</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --bar: #2a78d6; --bar-track: #f0efec;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --up: #b42318; --down: #006300; --hover: rgba(11,11,11,0.04); --sel: rgba(42,120,214,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --bar: #3987e5; --bar-track: #2c2c2a;
    --up: #e66767; --down: #0ca30c; --hover: rgba(255,255,255,0.05); --sel: rgba(57,135,229,0.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --bar: #3987e5; --bar-track: #2c2c2a;
  --up: #e66767; --down: #0ca30c; --hover: rgba(255,255,255,0.05); --sel: rgba(57,135,229,0.16);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 4px; }
.sub { color: var(--ink-2); font-size: 13px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 12px; }
.seg button[aria-pressed="true"] { background: var(--sel); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: 16px; }
.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.kpi-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.hero { font-size: 36px; font-weight: 650; margin: 8px 0 2px; }
.hero small { font-size: 15px; font-weight: 500; color: var(--ink-2); }
.meter { height: 10px; background: var(--bar-track); border-radius: 5px; overflow: hidden; margin: 8px 0 4px; }
.meter > div { height: 100%; border-radius: 5px; }
.status { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat .l { color: var(--muted); font-size: 12px; }
.stat .v { font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 6px 0 8px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 5; }
.tip b { display: block; margin-bottom: 2px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 28px 0 16px; }
.tabs button { border: 0; background: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 14px; color: var(--ink-2); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--s1); font-weight: 600; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.tbl-wrap { overflow-x: auto; max-height: 520px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none; }
tbody tr:hover { background: var(--hover); }
tbody tr.sel { background: var(--sel); }
tr.click { cursor: pointer; }
.ubar { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--bar); vertical-align: middle; margin-right: 8px; min-width: 2px; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.mt { margin-top: 16px; }
.warnbox { border-left: 3px solid var(--warning); padding: 10px 12px; background: var(--surface); border-radius: 6px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>NAS Storage Monitor</h1>
      <div class="sub" id="lastScan">Loading…</div>
    </div>
    <div class="controls">
      <span class="sub">History</span>
      <div class="seg" id="range">
        <button data-d="7">7d</button><button data-d="30">30d</button><button data-d="90" aria-pressed="true">90d</button><button data-d="365">1y</button>
      </div>
      <button id="theme" title="Toggle light/dark">Theme</button>
    </div>
  </header>

  <div id="alerts"></div>
  <div class="grid kpis" id="kpis"></div>

  <div class="card">
    <h2>Space used per day (% of capacity)</h2>
    <div class="legend" id="allLegend"></div>
    <div class="chart" id="allChart"></div>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="grid two">
    <div class="card">
      <h2 id="nasChartTitle">Used vs capacity</h2>
      <div class="sub">Daily used space; dashed line is total capacity</div>
      <div class="chart mt" id="nasChart"></div>
    </div>
    <div class="card">
      <div class="section-head">
        <div><h2>Day-wise history</h2><div class="sub">One row per scan day</div></div>
      </div>
      <div class="tbl-wrap" style="max-height:300px"><table id="dayTbl"></table></div>
    </div>
  </div>

  <div class="card mt">
    <div class="section-head">
      <div><h2>Usage by user</h2><div class="sub">Click a user to see their day-wise history</div></div>
      <div class="controls"><span class="sub">Date</span><select id="daySel"></select></div>
    </div>
    <div class="tbl-wrap"><table id="userTbl"></table></div>
  </div>

  <div class="card mt" id="userCard" hidden>
    <div class="section-head">
      <div><h2 id="userTitle"></h2><div class="sub" id="userSub"></div></div>
      <button id="userClose">Close</button>
    </div>
    <div class="grid two">
      <div class="chart" id="userChart"></div>
      <div class="tbl-wrap" style="max-height:300px"><table id="userDayTbl"></table></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const state = { days: 90, nas: null, data: null, users: null, user: null, sort: { key: 'bytes', dir: -1 } };
const SERIES = ['--s1', '--s2', '--s1', '--s2'];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

try { const t = localStorage.getItem('nas-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('#theme').onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('nas-theme', document.documentElement.dataset.theme); } catch (e) {}
  renderAll();
};

function fmtBytes(b, digits = 1) {
  if (b == null) return '–';
  const neg = b < 0; b = Math.abs(b);
  const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (neg ? '-' : '') + b.toFixed(i < 3 ? 0 : digits) + ' ' + u[i];
}
function fmtDelta(b) {
  if (b == null) return '<span class="flat">–</span>';
  if (Math.abs(b) < 1024 ** 2) return '<span class="flat">0</span>';
  return `<span class="${b > 0 ? 'up' : 'down'}">${b > 0 ? '▲ +' : '▼ '}${fmtBytes(b)}</span>`;
}
const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const fmtDateLong = d => new Date(d + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function statusOf(pct, th) {
  if (pct >= th.critical) return { c: '--critical', l: 'Critical', i: '⛔' };
  if (pct >= th.warning) return { c: '--warning', l: 'Warning', i: '⚠' };
  return { c: '--good', l: 'Healthy', i: '✓' };
}

/* ---------- line chart (SVG, hover crosshair + tooltip) ---------- */
function niceTicks(min, max, n = 5) {
  const span = max - min || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  const lo = Math.floor(min / step) * step, out = [];
  for (let v = lo; v <= max + step * 0.001; v += step) out.push(v);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}
function lineChart(el, { series, yFmt, tipFmt, refs = [], yMin, yMax, height = 260, label = true, bytes = false }) {
  el.innerHTML = '';
  const dates = [...new Set(series.flatMap(s => s.points.map(p => p.x)))].sort();
  if (!dates.length) { el.innerHTML = '<div class="empty">No data for this period yet.</div>'; return; }
  const W = el.clientWidth || 600, H = height, m = { t: 12, r: label ? 70 : 16, b: 26, l: 58 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const ys = series.flatMap(s => s.points.map(p => p.y)).concat(refs.map(r => r.y));
  let lo = yMin ?? Math.min(...ys), hi = yMax ?? Math.max(...ys);
  if (yMin == null) lo = lo - (hi - lo) * 0.1;
  let unit = 1;
  if (bytes) while (unit * 1024 <= hi) unit *= 1024;
  const ticks = niceTicks(Math.max(0, lo) / unit, hi / unit).map(t => t * unit);
  lo = ticks[0]; hi = ticks[ticks.length - 1];
  const x = d => m.l + (dates.length === 1 ? iw / 2 : dates.indexOf(d) / (dates.length - 1) * iw);
  const y = v => m.t + ih - (v - lo) / (hi - lo || 1) * ih;
  const ns = 'http://www.w3.org/2000/svg';
  let s = `<svg xmlns="${ns}" viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  ticks.forEach(t => {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="${css('--grid')}" stroke-width="1"/>`;
    s += `<text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${yFmt(t)}</text>`;
  });
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="${css('--axis')}"/>`;
  const nX = Math.max(2, Math.min(7, Math.floor(iw / 90)));
  for (let i = 0; i < nX; i++) {
    const d = dates[Math.round(i * (dates.length - 1) / (nX - 1))];
    s += `<text x="${x(d)}" y="${H - 6}" text-anchor="middle">${fmtDate(d)}</text>`;
  }
  refs.forEach(r => {
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(r.y)}" y2="${y(r.y)}" stroke="${css(r.color || '--muted')}" stroke-dasharray="5 4" stroke-width="1.5"/>`;
    s += `<text x="${m.l + 6}" y="${y(r.y) - 5}">${esc(r.label)}</text>`;
  });
  const labelY = series.map(se => { const l = se.points[se.points.length - 1]; return l ? y(l.y) + 4 : 0; });
  const order = labelY.map((v, k) => k).sort((a, b) => labelY[a] - labelY[b]);
  for (let k = 1; k < order.length; k++) labelY[order[k]] = Math.max(labelY[order[k]], labelY[order[k - 1]] + 14);
  series.forEach((se, si) => {
    const pts = se.points.map(p => `${x(p.x).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${css(se.color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = se.points[se.points.length - 1];
    if (last) {
      s += `<circle cx="${x(last.x)}" cy="${y(last.y)}" r="4" fill="${css(se.color)}" stroke="${css('--surface')}" stroke-width="2"/>`;
      if (label && series.length > 1) s += `<text x="${x(last.x) + 8}" y="${labelY[si]}" style="fill:${css('--ink-2')}">${esc(se.name)}</text>`;
    }
  });
  s += `<g class="hov" style="display:none"><line y1="${m.t}" y2="${m.t + ih}" stroke="${css('--axis')}"/>${series.map(se => `<circle r="5" fill="${css(se.color)}" stroke="${css('--surface')}" stroke-width="2"/>`).join('')}</g>`;
  s += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), hov = svg.querySelector('.hov'), tip = el.querySelector('.tip');
  const lookup = series.map(se => Object.fromEntries(se.points.map(p => [p.x, p])));
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(dates.length - 1, Math.round((px - m.l) / (iw || 1) * (dates.length - 1))));
    const d = dates[i];
    hov.style.display = '';
    hov.querySelector('line').setAttribute('x1', x(d)); hov.querySelector('line').setAttribute('x2', x(d));
    let rows = '';
    hov.querySelectorAll('circle').forEach((c, k) => {
      const p = lookup[k][d];
      c.style.display = p ? '' : 'none';
      if (p) { c.setAttribute('cx', x(d)); c.setAttribute('cy', y(p.y)); rows += `<div><span class="swatch" style="background:${css(series[k].color)}"></span>${esc(series[k].name)}: <b style="display:inline">${tipFmt(p)}</b></div>`; }
    });
    tip.innerHTML = `<b>${fmtDateLong(d)}</b>${rows}`;
    tip.style.display = 'block';
    const left = x(d) * r.width / W;
    tip.style.left = Math.min(left + 12, r.width - tip.offsetWidth - 4) + 'px';
    tip.style.top = '8px';
  });
  svg.addEventListener('mouseleave', () => { hov.style.display = 'none'; tip.style.display = 'none'; });
}

/* ---------- data ---------- */
async function api(path) { const r = await fetch(path); if (!r.ok) throw new Error(await r.text()); return r.json(); }

async function loadSummary() {
  state.data = await api(`api/summary?days=${state.days}`);
  if (!state.nas && state.data.nas.length) state.nas = state.data.nas[0].name;
  renderAll();
  await loadUsers();
}
async function loadUsers(day) {
  state.users = await api(`api/users?nas=${encodeURIComponent(state.nas)}${day ? '&day=' + day : ''}`);
  renderUsers();
  if (state.user) loadUserHistory(state.user);
}
async function loadUserHistory(user) {
  state.user = user;
  const h = await api(`api/user_history?nas=${encodeURIComponent(state.nas)}&user=${encodeURIComponent(user)}&days=${state.days}`);
  renderUser(h);
  renderUsers();
}

/* ---------- render ---------- */
function renderAll() {
  const { nas, thresholds: th } = state.data;
  const latestScan = nas.map(n => n.latest?.scanned_at).filter(Boolean).sort().pop();
  $('#lastScan').textContent = latestScan ? `Last scan: ${new Date(latestScan).toLocaleString()}` : 'No scans recorded yet — run collector.py';

  // alerts
  const alerts = [];
  nas.forEach(n => {
    if (!n.latest) alerts.push(`<b>${esc(n.name)}</b>: no data yet. Check that ${esc(n.path)} is mounted and the collector has run.`);
    else if (n.latest.day < state.data.today) alerts.push(`<b>${esc(n.name)}</b>: last scan was ${fmtDateLong(n.latest.day)} — the daily collector may not be running.`);
  });
  $('#alerts').innerHTML = alerts.map(a => `<div class="warnbox">⚠ ${a}</div>`).join('');

  // KPI cards
  $('#kpis').innerHTML = nas.map((n, i) => {
    if (!n.latest) return `<div class="card"><h2><span class="swatch" style="background:var(${SERIES[i]})"></span>${esc(n.name)}</h2><div class="empty">No data</div></div>`;
    const L = n.latest, pct = L.used_bytes / L.total_bytes * 100, st = statusOf(pct, th);
    const d = k => n.prev?.[k] ? L.used_bytes - n.prev[k].used_bytes : null;
    let eta = '–';
    const p30 = n.prev?.d30;
    if (p30) {
      const span = (new Date(L.day) - new Date(p30.day)) / 864e5;
      const rate = span > 0 ? (L.used_bytes - p30.used_bytes) / span : 0;
      eta = rate > 0 ? (() => { const dd = Math.floor(L.free_bytes / rate); return dd > 3650 ? '10+ yrs' : dd > 365 ? (dd / 365).toFixed(1) + ' yrs' : dd + ' days'; })() : 'Not growing';
      var rateTxt = rate ? `${fmtBytes(rate)}/day avg` : '';
    }
    return `<div class="card">
      <div class="kpi-head"><h2><span class="swatch" style="background:var(${SERIES[i]})"></span>${esc(n.name)}</h2>
        <span class="status" style="color:var(--ink-2)"><span style="color:var(${st.c})">${st.i}</span>${st.l}</span></div>
      <div class="sub">${esc(n.path)} · ${n.users} users/folders</div>
      <div class="hero">${pct.toFixed(1)}% <small>used</small></div>
      <div class="meter" title="${pct.toFixed(1)}%"><div style="width:${Math.min(100, pct)}%;background:var(${st.c})"></div></div>
      <div class="sub">${fmtBytes(L.used_bytes, 2)} of ${fmtBytes(L.total_bytes, 2)} · <b>${fmtBytes(L.free_bytes, 2)} free</b></div>
      <div class="stats">
        <div class="stat"><div class="l">Last 24h</div><div class="v">${fmtDelta(d('d1'))}</div></div>
        <div class="stat"><div class="l">Last 7 days</div><div class="v">${fmtDelta(d('d7'))}</div></div>
        <div class="stat"><div class="l">Last 30 days</div><div class="v">${fmtDelta(d('d30'))}</div></div>
      </div>
      <div class="stats" style="grid-template-columns:1fr">
        <div class="stat"><div class="l">Estimated time until full ${rateTxt ? '(' + rateTxt + ')' : ''}</div><div class="v">${eta}</div></div>
      </div></div>`;
  }).join('');

  // combined % chart
  const series = nas.map((n, i) => ({ name: n.name, color: SERIES[i], points: n.history.map(h => ({ x: h.day, y: h.used_bytes / h.total_bytes * 100, h })) }));
  $('#allLegend').innerHTML = nas.map((n, i) => `<span><span class="swatch" style="background:var(${SERIES[i]})"></span>${esc(n.name)}</span>`).join('');
  lineChart($('#allChart'), {
    series, yMin: 0, yMax: 100, yFmt: v => v + '%',
    refs: [{ y: th.warning, label: `Warn ${th.warning}%`, color: '--warning' }, { y: th.critical, label: `Crit ${th.critical}%`, color: '--critical' }],
    tipFmt: p => `${p.y.toFixed(1)}% · ${fmtBytes(p.h.used_bytes)}`,
  });

  // tabs
  $('#tabs').innerHTML = nas.map(n => `<button role="tab" aria-selected="${n.name === state.nas}" data-n="${esc(n.name)}">${esc(n.name)}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { state.nas = b.dataset.n; state.user = null; $('#userCard').hidden = true; renderAll(); loadUsers(); });

  renderNas();
  if (state.users) renderUsers();
}

function renderNas() {
  const i = state.data.nas.findIndex(n => n.name === state.nas), n = state.data.nas[i];
  if (!n) return;
  $('#nasChartTitle').textContent = `${n.name} — used vs capacity`;
  const total = n.latest?.total_bytes;
  lineChart($('#nasChart'), {
    series: [{ name: 'Used', color: SERIES[i], points: n.history.map(h => ({ x: h.day, y: h.used_bytes, h })) }],
    refs: total ? [{ y: total, label: 'Capacity' }] : [], yMin: 0, label: true, bytes: true,
    yFmt: v => fmtBytes(v, v % 1024 ** 4 ? 1 : 0), tipFmt: p => `${fmtBytes(p.y, 2)} (${(p.y / p.h.total_bytes * 100).toFixed(1)}%)`,
  });
  const rows = [...n.history].reverse();
  $('#dayTbl').innerHTML = `<thead><tr><th>Date</th><th>Used</th><th>Free</th><th>Used %</th><th>Change</th></tr></thead><tbody>` +
    (rows.length ? rows.map((h, k) => {
      const prev = rows[k + 1];
      return `<tr><td>${fmtDateLong(h.day)}</td><td>${fmtBytes(h.used_bytes, 2)}</td><td>${fmtBytes(h.free_bytes, 2)}</td>
        <td>${(h.used_bytes / h.total_bytes * 100).toFixed(1)}%</td><td>${fmtDelta(prev ? h.used_bytes - prev.used_bytes : null)}</td></tr>`;
    }).join('') : '<tr><td colspan="5" class="empty">No data</td></tr>') + '</tbody>';
}

function renderUsers() {
  const U = state.users; if (!U) return;
  $('#daySel').innerHTML = U.days.map(d => `<option value="${d}" ${d === U.day ? 'selected' : ''}>${fmtDateLong(d)}</option>`).join('');
  const total = U.users.reduce((a, u) => a + u.bytes, 0), max = Math.max(1, ...U.users.map(u => u.bytes));
  const { key, dir } = state.sort;
  const list = [...U.users].sort((a, b) => {
    const av = a[key] ?? -Infinity, bv = b[key] ?? -Infinity;
    return (typeof av === 'string' ? av.localeCompare(bv) : av - bv) * dir;
  });
  const cols = [['user', 'User / folder'], ['bytes', 'Size'], ['share', 'Share'], ['files', 'Files'], ['d1', '24h change'], ['d7', '7d change'], ['d30', '30d change']];
  $('#userTbl').innerHTML = `<thead><tr>${cols.map(([k, l]) => `<th data-k="${k}">${l}${k === key ? (dir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>` +
    (list.length ? list.map(u => `<tr class="click ${u.user === state.user ? 'sel' : ''}" data-u="${esc(u.user)}">
      <td>${esc(u.user)}</td>
      <td><span class="ubar" style="width:${Math.round(u.bytes / max * 120)}px"></span>${fmtBytes(u.bytes, 2)}</td>
      <td>${total ? (u.bytes / total * 100).toFixed(1) : 0}%</td>
      <td>${u.files.toLocaleString()}</td><td>${fmtDelta(u.d1)}</td><td>${fmtDelta(u.d7)}</td><td>${fmtDelta(u.d30)}</td></tr>`).join('')
      : '<tr><td colspan="7" class="empty">No user data</td></tr>') +
    `</tbody><tfoot><tr><td><b>Total (${list.length})</b></td><td><b>${fmtBytes(total, 2)}</b></td><td>100%</td><td>${U.users.reduce((a, u) => a + u.files, 0).toLocaleString()}</td><td colspan="3"></td></tr></tfoot>`;
  $('#userTbl').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k === 'share' ? 'bytes' : th.dataset.k;
    state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : (k === 'user' ? 1 : -1) };
    renderUsers();
  });
  $('#userTbl').querySelectorAll('tbody tr[data-u]').forEach(tr => tr.onclick = () => loadUserHistory(tr.dataset.u));
}

function renderUser(h) {
  $('#userCard').hidden = false;
  $('#userTitle').textContent = `${h.user} on ${state.nas}`;
  const last = h.history[h.history.length - 1], first = h.history[0];
  $('#userSub').innerHTML = last ? `Now ${fmtBytes(last.bytes, 2)} · ${fmtDelta(last.bytes - first.bytes)} over the selected period` : 'No history';
  const i = state.data.nas.findIndex(n => n.name === state.nas);
  lineChart($('#userChart'), {
    series: [{ name: h.user, color: SERIES[i], points: h.history.map(p => ({ x: p.day, y: p.bytes, p })) }],
    bytes: true, yFmt: v => fmtBytes(v), tipFmt: p => `${fmtBytes(p.y, 2)} · ${p.p.files.toLocaleString()} files`, label: false,
  });
  const rows = [...h.history].reverse();
  $('#userDayTbl').innerHTML = `<thead><tr><th>Date</th><th>Size</th><th>Files</th><th>Change</th></tr></thead><tbody>` +
    rows.map((r, k) => `<tr><td>${fmtDateLong(r.day)}</td><td>${fmtBytes(r.bytes, 2)}</td><td>${r.files.toLocaleString()}</td><td>${fmtDelta(rows[k + 1] ? r.bytes - rows[k + 1].bytes : null)}</td></tr>`).join('') + '</tbody>';
  if (!$('#userCard').dataset.seen) { $('#userCard').dataset.seen = 1; $('#userCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

$('#daySel').onchange = e => loadUsers(e.target.value);
$('#userClose').onclick = () => { state.user = null; $('#userCard').hidden = true; renderUsers(); };
$('#range').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('#range').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  state.days = +b.dataset.d; loadSummary();
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (state.data) { renderAll(); if (state.user) loadUserHistory(state.user); } }, 150); });

loadSummary().catch(e => { $('#lastScan').textContent = 'Failed to load data: ' + e.message; });
setInterval(() => loadSummary().catch(() => {}), 10 * 60 * 1000);
</script>
</body>
</html>
