<html lang="en">

<style>
:root {
  color-scheme: light;
  --page: #f6f5f1; --surface: #ffffff; --surface-2: #f4f3ef; --ink: #14130f; --ink-2: #52514e; --muted: #898781;
  --grid: #eceae4; --axis: #c3c2b7; --border: rgba(20,19,15,0.08);
  --shadow: 0 1px 2px rgba(20,19,15,.04), 0 10px 30px rgba(20,19,15,.05);
  --s1: #2a78d6; --s1-tint: #e3eefb; --s2: #1baf7a; --s2-tint: #ddf4ea; --s2-ink: #0f7f57;
  --bar: #2a78d6; --track: #eceae4;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --up: #b42318; --down: #006300; --hover: rgba(20,19,15,0.03); --sel: rgba(42,120,214,0.08);
  --glow-a: rgba(27,175,122,.10); --glow-b: rgba(235,150,52,.08);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.09);
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --s1: #3987e5; --s1-tint: rgba(57,135,229,.16); --s2: #199e70; --s2-tint: rgba(25,158,112,.16); --s2-ink: #2fc48e;
  --bar: #3987e5; --track: #2c2c2a;
  --up: #e66767; --down: #0ca30c; --hover: rgba(255,255,255,0.04); --sel: rgba(57,135,229,0.14);
  --glow-a: rgba(25,158,112,.08); --glow-b: rgba(235,150,52,.05);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); background-color: var(--page);
  background-image: radial-gradient(900px 500px at 92% -5%, var(--glow-a), transparent 60%),
                    radial-gradient(700px 400px at 5% -10%, var(--glow-b), transparent 60%);
  background-attachment: fixed;
  font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.topline { height: 3px; background: linear-gradient(90deg, #2a78d6, #1baf7a 55%, #e0912f); }
a { color: inherit; }
.wrap { max-width: none; margin: 0 auto; padding: 0 28px 40px; }
button, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.banner { margin: 16px auto 0; max-width: 760px; text-align: center; font-size: 13px; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--warning); border-radius: 8px; padding: 8px 12px; }

/* ---------- landing ---------- */
.hero-head { text-align: center; padding: 56px 0 8px; }
.brand { display: inline-flex; align-items: center; gap: 16px; }
.logo { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; flex: none;
  background: linear-gradient(145deg, #e0912f, #b45f1c); box-shadow: 0 6px 16px rgba(180,95,28,.28); }
.logo svg { width: 28px; height: 28px; }
.hero-head h1 { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
.hero-head p { color: var(--ink-2); font-size: 16px; max-width: 470px; margin: 14px auto 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; max-width: 940px; margin: 64px auto 0; }
@media (max-width: 420px) { .cards { grid-template-columns: 1fr; } .hero-head h1 { font-size: 28px; } }
.syscard { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--accent); border-radius: 14px;
  padding: 28px 28px 24px; box-shadow: var(--shadow); text-decoration: none; display: block; transition: transform .15s, box-shadow .15s; }
.syscard:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,19,15,.05), 0 16px 40px rgba(20,19,15,.08); }
.ico { width: 60px; height: 60px; border-radius: 12px; background: var(--tint); display: grid; place-items: center; color: var(--accent); }
.ico svg { width: 28px; height: 28px; }
.syscard h2 { font-size: 20px; font-weight: 700; margin: 22px 0 6px; }
.syscard .desc { color: var(--ink-2); margin: 0 0 16px; min-height: 42px; }
.cardstat { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cardstat .pct { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.cardstat .pct small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
.meter { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin: 8px 0 6px; }
.meter > div { height: 100%; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; }
.chip svg { width: 13px; height: 13px; }
.open { color: var(--accent-ink, var(--accent)); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.syscard:hover .open svg { transform: translateX(3px); }
.open svg { width: 16px; height: 16px; transition: transform .15s; }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 72px; }

/* ---------- module ---------- */
.modhead { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 28px 0 20px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 13px; margin-bottom: 14px; }
.back:hover { color: var(--ink); }
.back svg { width: 16px; height: 16px; }
.modtitle { display: flex; align-items: center; gap: 14px; }
.modtitle .ico { width: 48px; height: 48px; }
.modtitle .ico svg { width: 24px; height: 24px; }
.modtitle h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
.sub { color: var(--ink-2); font-size: 13px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
.seg button { border: 0; border-radius: 6px; padding: 5px 12px; background: none; color: var(--ink-2); font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.panel h3 { font-size: 15px; font-weight: 700; margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .tiles { grid-template-columns: 1fr; } }
.tile .l { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.tile .v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
.tile .s { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.status { font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 960px) { .cols { grid-template-columns: 1fr; } }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; font-family: Inter, system-ui, sans-serif; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 5; }
.tip b { display: block; margin-bottom: 2px; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
.tbl { overflow: auto; max-height: 460px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none; }
tbody tr:hover { background: var(--hover); }
tbody tr.sel { background: var(--sel); }
tr.click { cursor: pointer; }
tfoot td { font-weight: 700; border-bottom: 0; }
.ubar { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--bar); vertical-align: middle; margin-right: 8px; min-width: 2px; }
.empty { color: var(--muted); padding: 28px; text-align: center; }
.mt { margin-top: 16px; }
.themebtn { position: fixed; right: 16px; bottom: 16px; font-size: 12px; padding: 6px 10px; box-shadow: var(--shadow); }
/* ---------- module v2 (NGS-style) ---------- */
.mbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 28px 0 22px; }
.mbar .ttl { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mbar .logo { width: 48px; height: 48px; border-radius: 12px; }
.mbar .logo svg { width: 24px; height: 24px; }
.mbar h1 { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.mbar .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mbar .acts .btn { padding: 8px 12px; }
@media (max-width: 1000px) { .mbar { grid-template-columns: 1fr; } .mbar .acts { justify-content: flex-start; } }
@media (max-width: 700px) { .mbar { grid-template-columns: 1fr; } }
.switch { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 4px; box-shadow: var(--shadow); }
.switch a { padding: 8px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; text-decoration: none; color: var(--ink); }
.switch a[aria-current="page"] { background: var(--s1); color: #fff; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 9px; font-weight: 600; font-size: 14px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); text-decoration: none; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--s1); color: #fff; border-color: transparent; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.kpis4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 18px 0 20px; }
@media (max-width: 1000px) { .kpis4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .kpis4 { grid-template-columns: 1fr; } }
.kpi { display: flex; align-items: center; gap: 18px; padding: 18px; }
.kpi .bigico { width: 84px; height: 84px; border-radius: 14px; flex: none; display: grid; place-items: center; }
.kpi .bigico svg { width: 36px; height: 36px; }
.kpi .l { color: var(--ink-2); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.kpi .v { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin: 2px 0; }
.kpi .s { color: var(--ink-2); font-size: 13px; }
.t-blue { background: var(--s1-tint); color: var(--s1); }
.t-red { background: rgba(208,59,59,.12); color: var(--critical); }
.t-green { background: var(--s2-tint); color: var(--s2-ink); }
.t-gray { background: var(--surface-2); }
.row2 { display: grid; grid-template-columns: 1fr 1.25fr; gap: 20px; margin-bottom: 20px; }
@media (max-width: 1000px) { .row2 { grid-template-columns: 1fr; } }
.panel.big { padding: 26px 28px; }
.panel.big h3 { font-size: 18px; }
.mini4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 18px 0 14px; }
.mini { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.mini .l { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.mini .v { font-size: 20px; font-weight: 800; margin-top: 4px; }
.v.red { color: var(--critical); } .v.green { color: var(--s2-ink); } .v.amber { color: #b7791f; }
.strip { display: flex; border: 1px solid var(--border); border-radius: 12px; margin: 18px 0 16px; overflow-x: auto; }
.strip > div { flex: 1; min-width: 104px; text-align: center; padding: 14px 8px; }
.strip > div + div { border-left: 1px solid var(--grid); }
.strip .l { color: var(--ink-2); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .v { font-size: 20px; font-weight: 800; margin: 2px 0; white-space: nowrap; }
.strip .s { color: var(--ink-2); font-size: 12px; }
.strip .tot .v { color: var(--s1); }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 210px) 1fr auto; gap: 12px; align-items: center; cursor: pointer; padding: 3px 4px; border-radius: 6px; }
.hbar:hover, .hbar.sel { background: var(--hover); }
.hbar.sel { background: var(--sel); }
.hbar .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .tr { height: 14px; background: var(--track); border-radius: 7px; overflow: hidden; }
.hbar .tr > div { height: 100%; border-radius: 7px; background: var(--accent); }
.hbar .r { font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 128px; text-align: right; }
.legend2 { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin: 14px 0 6px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.banner a { color: var(--s1); font-weight: 600; }
.banner.info { border-left-color: var(--s1); }
.ttable th, .ttable td { padding: 8px 5px; }
.ttable { font-size: 12.5px; }
.hero-acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
.overview { display: grid; grid-template-columns: repeat(6, 1fr); padding: 0; margin: 28px 0 0; }
.overview > div { padding: 18px 20px; }
.overview > div + div { border-left: 1px solid var(--grid); }
.overview .l { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.overview .v { font-size: 22px; font-weight: 800; margin-top: 4px; white-space: nowrap; }
.overview .s { color: var(--ink-2); font-size: 12px; }
@media (max-width: 1000px) { .overview { grid-template-columns: repeat(3, 1fr); } .overview > div:nth-child(4) { border-left: 0; } .overview > div:nth-child(n+4) { border-top: 1px solid var(--grid); } }
@media (max-width: 560px) { .overview { grid-template-columns: repeat(2, 1fr); } .overview > div { border-left: 0 !important; border-top: 1px solid var(--grid); } }
.cards { max-width: none; margin-top: 28px; }
.topu { margin: 14px 0 0; border-top: 1px solid var(--grid); padding-top: 12px; }
.topu .l { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.tu { display: grid; grid-template-columns: minmax(0, 1.3fr) 1fr auto; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; color: var(--ink); }
.tu .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.tu .tr { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.tu .tr span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.tu .r { color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.controls2 { display: flex; gap: 8px; flex-wrap: wrap; }
.controls2 input { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 200px; }
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .hero-acts, .acts, .switch, .btn.small, #rangeSel, #lrange, #daySel, .controls2, .toast, .topline, .banner a { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .hero-head { padding-top: 0; }
  .cards { margin-top: 16px; }
  .panel, .syscard, .kpi { box-shadow: none !important; break-inside: avoid; }
  .tbl { max-height: none !important; overflow: visible !important; }
  .syscard:hover { transform: none; }
  footer { margin-top: 16px; }
}
.btn.green { background: #0f7f57; color: #fff; border-color: transparent; }
.cards { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
#editor { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; }
.ed-back { position: absolute; inset: 0; background: rgba(20,19,15,.45); }
.ed-card { position: relative; background: var(--surface); border-radius: 14px; padding: 22px 24px; width: min(1500px, calc(100vw - 32px)); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
.ed-bar, .ed-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.ed-bar label, .ed-foot label { font-size: 12px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.ed-bar input, .ed-foot input { font: inherit; font-weight: 500; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); }
.ed-foot .grow { flex: 1; } .ed-foot .grow input { flex: 1; min-width: 260px; }
.sp { flex: 1; }
.ed-tbl { flex: 1; max-height: none; border: 1px solid var(--border); border-radius: 10px; }
.ed-tbl th { position: sticky; top: 0; background: var(--surface-2); cursor: default; }
.ed-tbl td { padding: 3px 4px; }
.ed-tbl input { width: 100%; min-width: 64px; font: inherit; font-size: 13px; padding: 5px 6px; border: 1px solid transparent; border-radius: 6px; background: var(--surface-2); text-align: right; color: var(--ink); }
.ed-tbl input[type=text] { text-align: left; min-width: 130px; }
.ed-tbl input:focus { outline: none; border-color: var(--s1); background: var(--surface); }
.ed-tbl td.d { color: var(--ink-2); font-variant-numeric: tabular-nums; padding-right: 10px; }
.ed-tbl .x { border: 0; background: none; font-size: 18px; color: var(--muted); padding: 2px 8px; }
.ed-tbl .x:hover { color: var(--critical); }
</style>
</head>

const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const uploadsKey = n => 'nas-uploads:' + n;
const sheetKey = n => 'nas-sheet:' + n;

async function loadDepartments(data) {
  const any = data.nas.map(n => n.sheet_url && n.sheet_url.match(/\/spreadsheets\/d\/([\w-]+)/)).find(Boolean);
  if (!any) return;
  try {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${any[1]}/gviz/tq?tqx=out:csv&headers=1&sheet=Departments`, { cache: 'no-store' });
    if (!r.ok) return;
    const rows = csvToRows(await r.text());
    if (!/username/i.test((rows[0] || [])[0] || '')) return;
    rows.slice(1).forEach(([u, d]) => { if (u && d) data.user_departments[u.trim().toLowerCase()] = d.trim(); });
  } catch (e) {}
}
async function applySources(data) {
  data.user_departments = data.user_departments || {};
  await loadDepartments(data);
  for (const n of data.nas) {
    n.src = { sheet: null, uploads: 0 };
    const url = LS.get(sheetKey(n.name), null) || n.sheet_url;
    if (url) {
      n.src.sheet = { url, shared: !!n.sheet_url && url === n.sheet_url };
      try {
        const r = await fetch(sheetCsvUrl(url), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const text = await r.text();
        if (/^\s*</.test(text)) throw new Error('the sheet is not shared publicly');
        if (!text.replace(/[\s,"]/g, '')) { n.src.sheet.empty = true; continue; }
        parseTransferSheet(csvToRows(text), null).forEach(s => applySnapshot(n, s));
        n.src.sheet.ok = true;
      } catch (e) { if (/no department rows/.test(e.message)) n.src.sheet.empty = true; else n.src.sheet.error = e.message; }
    }
    const ups = LS.get(uploadsKey(n.name), []);
    ups.forEach(s => applySnapshot(n, s));
    n.src.uploads = ups.length;
  }
}

async function onUpload(n, file) {
  try {
    const snaps = parseTransferSheet(await readFileRows(file), file.lastModified ? new Date(file.lastModified) : null);
    const ups = LS.get(uploadsKey(n.name), []).filter(u => !snaps.some(s => s.day === u.day));
    if (!LS.set(uploadsKey(n.name), [...ups, ...snaps])) alert('This browser blocks saving, so the upload will be lost on reload.');
    state.day = null;
    await load();
    toast(`Loaded ${snaps.reduce((t, s) => t + s.rows.length, 0)} departments for ${snaps.map(s => fmtFull(s.day)).join(', ')} from ${file.name}`);
  } catch (e) { alert('Could not read ' + file.name + ':\n' + e.message); }
}

function toast(msg) {
  const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: msg });
  document.body.appendChild(t); setTimeout(() => t.remove(), 4500);
}

function sourceNote(n) {
  const out = [];
  const sh = n.src && n.src.sheet;
  if (false) out.push(`\u2139 Live from Google Sheet${sh.shared ? '' : ' (connected in this browser only)'} · read ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
  if (sh && sh.empty) out.push(`\u2139 The live sheet tab for ${esc(n.name)} is connected but still empty. Figures appear here as soon as the report table is pasted into it.`);
  if (sh && sh.error) out.push(`Could not read the live sheet: ${esc(sh.error)}. In Google Sheets use Share → "Anyone with the link can view", or File → Share → Publish to web → CSV.`);
  if (n.src && n.src.uploads) out.push(`Includes ${n.src.uploads} uploaded report${n.src.uploads > 1 ? 's' : ''} saved <b>in this browser only</b>. Other people won't see ${n.src.uploads > 1 ? 'them' : 'it'}. <a href="#" data-clear="${esc(n.name)}">Remove uploads</a>`);
  return out;
}

const blankRow = (share = '') => ({ department: share ? deptMap()[share] || '' : '', share, samples: '', copied_gb: '', pct_copied: '' });
const fromRow = r => ({ department: hasShare(r) && deptMap()[r.share.toLowerCase()] || r.department, share: hasShare(r) ? r.share.toLowerCase() : '',

  };
}

/* ---------- user -> department ---------- */
const deptMap = () => (state.data && state.data.user_departments) || {};
function ulabel(k) {
  const d = deptMap()[String(k).toLowerCase()];
  return !d ? k : d.toLowerCase() === String(k).toLowerCase() ? d : `${d} · ${k}`;
}
/* department name for a transfer row: the mapped department, plus the share when several shares share a department */
function deptLabel(r) {
  const m = deptMap(), d = r.share && m[r.share.toLowerCase()];
  if (!d) return r.department;
  return Object.values(m).filter(x => x === d).length > 1 ? ulabel(r.share.toLowerCase()) : d;
}

function banner(n) {
  const msgs = [];
  if (n && n.demo) msgs.push(`<b>${esc(n.name)}</b> is showing <b>sample data</b>. Real figures appear once its tab in the live sheet is filled in.`);
  if (n && n.src) msgs.push(...sourceNote(n));
  if (n && !n.demo && n.transfer && n.days.length && n.days[n.days.length - 1] === n.transfer.day && n.total[n.total.length - 1] == null)
    msgs.push(`Figures come from the department transfer report of ${fmtFull(n.transfer.day)}. Disk capacity is not set yet, so % used and free space are not shown.`);
  if (!n) { const demo = state.data.nas.filter(x => x.demo).map(x => esc(x.name)); if (demo.length) msgs.push(`<b>${demo.join(', ')}</b> ${demo.length > 1 ? 'are' : 'is'} showing sample data until ${demo.length > 1 ? 'their tabs' : 'its tab'} in the live sheet ${demo.length > 1 ? 'are' : 'is'} filled in.`); }
  return msgs.map(m => m.startsWith('\u2139 ') ? `<div class="banner info">${m.slice(2)}</div>` : `<div class="banner">${m}</div>`).join('');
}

function allUserRows() {
  return state.data.nas.flatMap(n => {
    const st = nasStats(n); if (!st) return [];
    const list = userRows(n, st.day), tot = list.reduce((t, u) => t + u.bytes, 0);
    return list.map(u => ({ ...u, nas: n.name, day: st.day, share: tot ? u.bytes / tot * 100 : 0, pctCap: st.total ? u.bytes / st.total * 100 : null, demo: n.demo }));
  });
}
function renderAllUsers() {
  const q = (state.q || '').toLowerCase();
  let list = allUserRows().filter(u => (!state.unas || u.nas === state.unas) && (!q || (u.user + ' ' + ulabel(u.user)).toLowerCase().includes(q)));
  const s = state.lsort || { key: 'bytes', dir: -1 };
  list.sort((p, r) => { const av = p[s.key] ?? -Infinity, bv = r[s.key] ?? -Infinity; return (typeof av === 'string' ? av.localeCompare(bv) : av - bv) * s.dir; });
  const total = list.reduce((t, u) => t + u.bytes, 0), max = Math.max(1, ...list.map(u => u.bytes));
  $('#allSub').textContent = `${list.length} users / folders · ${fmtBytes(total, 2)} · latest data per NAS. Click a row to open it.`;
  const cols = [['user', 'User / folder'], ['nas', 'NAS'], ['bytes', 'Size'], ['share', 'Share of NAS'], ['pctCap', '% of capacity'], ['files', 'Files'], ['d1', '24h'], ['d7', '7 days'], ['d30', '30 days'], ['day', 'As of']];

const fmtGB = v => v == null ? 'n/a' : Math.round(v).toLocaleString() + ' GB';

const TCOLS = [
  ['Department', r => deptLabel(r), 'l'], ['Users', r => r.share || '–', 'l'], ['Checked?', r => r.checked || '', 'l'],
  ['Samples', r => r.samples], ['Complete', r => r.complete], ['Partial', r => r.partial], ['Not started', r => r.not_started],
  ['Pending samples', r => r.pending], ['No files', r => r.no_files],
  ['Size (GB)', r => r.size_gb_given ?? (r.size_est ? null : r.size_gb)], ['Copied (GB)', r => r.copied_gb], ['Pending (GB)', r => r.pending_gb_given ?? null],
  ['% data copied', r => rowPct(r), 'pct'],
];
function transferCols(rows) { return TCOLS.filter(([, f]) => rows.some(r => { const v = f(r); return v != null && v !== '' && v !== '–'; })); }
function transferTotals(t) {
  const rows = t.rows.filter(hasShare);
  const sum = k => rows.reduce((s, r) => s + (r[k] || 0), 0), any = k => rows.some(r => r[k] != null);
  const tot = { rows: rows.length, samples: sum('samples'), complete: any('complete') ? sum('complete') : null, partial: sum('partial'), not_started: sum('not_started'),
    pending: sum('pending'), no_files: sum('no_files'), copied_gb: sum('copied_gb'),
    size_gb: rows.every(r => r.size_gb != null) ? sum('size_gb') : null, size_est: rows.some(r => r.size_est), checked: t.rows.filter(r => /^(yes|checked)/i.test(r.checked || '')).length };
  tot.pending_gb = tot.size_gb != null ? Math.max(0, tot.size_gb - tot.copied_gb) : null;
  tot.pctComplete = tot.complete != null && tot.samples - tot.no_files > 0 ? tot.complete / (tot.samples - tot.no_files) * 100 : null;

}

  lineChart($('#nasChart'), {
    series: [{ name: 'Used', color: a.c, points: rng.map(o => ({ x: o.day, y: n.used[o.k], k: o.k })) }],
    refs: st.hasCap ? [{ y: st.total, label: 'Total: ' + fmtBytes(st.total), right: true }] : [], yMin: 0, bytes: true, area: true, markers: rng.length <= 45, height: 300,
    yFmt: v => fmtBytes(v, v % 1024 ** 4 ? 1 : 0), tipFmt: p => `${fmtBytes(p.y, 2)} used${n.total[p.k] ? ` (${(p.y / n.total[p.k] * 100).toFixed(1)}%)` : ''}`,
  });

  const cr = rng.filter(o => o.k > 0).slice(-30);
  $('#cbSub').textContent = cr.length ? `${fmtFull(cr[0].day)} → ${fmtFull(cr[cr.length - 1].day)} · net ${fmtBytes(cr.reduce((t, o) => t + n.used[o.k] - n.used[o.k - 1], 0))}` : '';
  barChart($('#changeChart'), cr.map(o => ({ x: o.day, y: n.used[o.k] - n.used[o.k - 1] })), a.c);

  const rows = [...rng].reverse();
  $('#dayTbl').innerHTML = `<table><thead><tr><th>Date</th><th>Used</th><th>Free</th><th>%</th><th>Change</th></tr></thead><tbody>` +
    rows.map(o => `<tr><td>${fmtDateLong(o.day)}</td><td>${fmtBytes(n.used[o.k], 2)}</td><td>${fmtBytes(n.free[o.k], 2)}</td>
      <td>${n.total[o.k] ? (n.used[o.k] / n.total[o.k] * 100).toFixed(1) + '%' : '–'}</td><td>${fmtDelta(o.k > 0 ? n.used[o.k] - n.used[o.k - 1] : null)}</td></tr>`).join('') + '</tbody></table>';

  if (state.day == null || !n.days.includes(state.day)) state.day = st.day;
  $('#daySel').innerHTML = [...n.days].reverse().map(x => `<option value="${x}" ${x === state.day ? 'selected' : ''}>${fmtFull(x)}</option>`).join('');
  $('#daySel').onchange = e => { state.day = e.target.value; renderUsers(n, a); if (state.user) renderUser(n, a); };
  renderUsers(n, a);
  if (state.user && n.users[state.user]) renderUser(n, a); else state.user = null;
}

function bindHead(n) {
  $('#reload').onclick = () => load().then(() => toast('Data refreshed')).catch(e => alert(e.message));
  $('#edit').onclick = () => openEditor(n);
  if (false) $('#sheetBtn').onclick = async () => {
    const cur = LS.get(sheetKey(n.name), null) || n.sheet_url || '';
    const url = prompt(`Paste the Google Sheet link for ${n.name}.\n\nThe sheet must be shared as "Anyone with the link can view" (or published to the web). It needs a "Department" header row with the same columns as the transfer status report. To keep day-wise history in one sheet, add a "Date" column.\n\nThis connects the sheet in this browser. To show it for everyone, set "sheet_url" for this NAS in config.json.\nLeave empty to disconnect.`, cur);
    if (url === null) return;
    if (url.trim()) LS.set(sheetKey(n.name), url.trim()); else LS.del(sheetKey(n.name));
    await load().catch(e => alert(e.message));
  };
  document.querySelectorAll('[data-clear]').forEach(a => a.onclick = async ev => {
    ev.preventDefault();
    if (!confirm('Remove the reports uploaded in this browser for ' + n.name + '?')) return;
    LS.del(uploadsKey(n.name)); state.day = null; await load();
  });
  $('#csv').onclick = () => downloadExcel([n]);
  $('#pdf').onclick = () => window.print();
}

function barChart(el, pts, color) {
  if (!pts.length) { el.innerHTML = '<div class="empty">Needs at least two scans.</div>'; return; }
  const W = el.clientWidth || 500, H = 280, m = { t: 12, r: 8, b: 28, l: 60 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = pts.map(p => p.y), hiAbs = Math.max(...vals.map(Math.abs), 1);
  let unit = 1; while (unit * 1024 <= hiAbs) unit *= 1024;
  const ticks = niceTicks(Math.min(0, ...vals) / unit, Math.max(0, ...vals) / unit, 4).map(t => t * unit);
  const lo = ticks[0], hi = ticks[ticks.length - 1], y = v => m.t + ih - (v - lo) / (hi - lo || 1) * ih;
  const bw = iw / pts.length, w = Math.max(2, Math.min(28, bw - 2));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  ticks.forEach(t => { s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="${css(t === 0 ? '--axis' : '--grid')}"/><text x="${m.l - 10}" y="${y(t) + 4}" text-anchor="end">${fmtBytes(t)}</text>`; });
  pts.forEach((p, i) => {
    const x = m.l + i * bw + (bw - w) / 2, y0 = y(0), y1 = y(p.y), top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0)), r = Math.min(4, w / 2, h);
    const path = p.y >= 0
      ? `M${x},${y0}V${top + r}q0,-${r} ${r},-${r}h${w - 2 * r}q${r},0 ${r},${r}V${y0}z`
      : `M${x},${y0}V${top + h - r}q0,${r} ${r},${r}h${w - 2 * r}q${r},0 ${r},-${r}V${y0}z`;
    s += `<path d="${path}" fill="${css(p.y >= 0 ? color : '--axis')}"/>`;
    s += `<rect class="hit" data-i="${i}" x="${m.l + i * bw}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`;
  });
  const nX = Math.max(2, Math.min(6, Math.floor(iw / 80), pts.length));
  for (let k = 0; k < nX; k++) { const i = Math.round(k * (pts.length - 1) / (nX - 1)); s += `<text x="${m.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${fmtDate(pts[i].x)}</text>`; }
  s += '</svg><div class="tip"></div>';
  el.innerHTML = s;
  const tip = el.querySelector('.tip'), svg = el.querySelector('svg');
  el.querySelectorAll('.hit').forEach(r => {
    r.addEventListener('mouseenter', () => {
      const p = pts[+r.dataset.i], b = svg.getBoundingClientRect(), x = (+r.getAttribute('x') + bw / 2) * b.width / W;
      r.setAttribute('fill', css('--hover'));
      tip.innerHTML = `<b>${fmtDateLong(p.x)}</b>${p.y >= 0 ? 'Added' : 'Freed'}: ${fmtBytes(Math.abs(p.y), 2)}`;
      tip.style.display = 'block'; tip.style.top = '4px';
      tip.style.left = Math.max(4, Math.min(x + 10, b.width - tip.offsetWidth - 4)) + 'px';
    });
    r.addEventListener('mouseleave', () => { r.setAttribute('fill', 'transparent'); tip.style.display = 'none'; });
  });
}

function userRows(n, day = state.day) {
  const k = n.days.indexOf(day);
  const back = days => { const j = idxOnOrBefore(n.days, shiftDay(day, days)); return j >= 0 && j < k ? j : -1; };
  const j1 = back(1), j7 = back(7), j30 = back(30);
  const dd = (u, j) => j >= 0 && u.bytes[j] != null ? u.bytes[k] - u.bytes[j] : null;
  return Object.entries(n.users).filter(([, u]) => u.bytes[k] != null)
    .map(([user, u]) => ({ user, bytes: u.bytes[k], files: u.files[k], d1: dd(u, j1), d7: dd(u, j7), d30: dd(u, j30) }));
}

function renderUsers(n, a) {
  const list = userRows(n), total = list.reduce((s, u) => s + u.bytes, 0), files = list.reduce((s, u) => s + (u.files || 0), 0);
  const bySize = [...list].sort((p, q) => q.bytes - p.bytes), max = Math.max(1, ...list.map(u => u.bytes));
  $('#ubSub').textContent = `${fmtFull(state.day)} · ${list.length} users · ${fmtBytes(total, 2)}`;
  $('#ubody').innerHTML = `
    <div class="strip">${bySize.slice(0, 4).map(u => `<div><div class="l" title="${esc(ulabel(u.user))}">${esc(ulabel(u.user))}</div><div class="v">${fmtBytes(u.bytes, 1)}</div><div class="s">${total ? (u.bytes / total * 100).toFixed(1) : 0}%</div></div>`).join('')}
      <div class="tot"><div class="l">Total</div><div class="v">${fmtBytes(total, 1)}</div><div class="s">${files ? files.toLocaleString() + ' files' : list.length + ' shares'}</div></div></div>
    <div class="hbars">${bySize.map(u => `<div class="hbar ${u.user === state.user ? 'sel' : ''}" data-u="${esc(u.user)}" title="Show ${esc(ulabel(u.user))} history">
      <div class="n" title="${esc(ulabel(u.user))}">${esc(ulabel(u.user))}</div><div class="tr"><div style="width:${Math.max(0.5, u.bytes / max * 100)}%"></div></div>
      <div class="r">${fmtBytes(u.bytes, 2)} · ${total ? (u.bytes / total * 100).toFixed(1) : 0}%</div></div>`).join('') || '<div class="empty">No user data for this day</div>'}</div>`;

  const { key, dir } = state.sort;
  list.sort((p, q) => { const av = p[key] ?? -Infinity, bv = q[key] ?? -Infinity; return (typeof av === 'string' ? av.localeCompare(bv) : av - bv) * dir; });
  const cols = [['user', 'User / folder'], ['bytes', 'Size'], ['share', 'Share'], ['files', 'Files'], ['d1', '24h'], ['d7', '7 days'], ['d30', '30 days']];
  $('#userTbl').innerHTML = `<table><thead><tr>${cols.map(([c, l]) => `<th data-k="${c}">${l}${c === key ? (dir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('')}</tr></thead><tbody>` +
    list.map(u => `<tr class="click ${u.user === state.user ? 'sel' : ''}" data-u="${esc(u.user)}">
      <td>${esc(ulabel(u.user))}</td><td>${fmtBytes(u.bytes, 2)}</td><td>${total ? (u.bytes / total * 100).toFixed(1) : 0}%</td><td>${u.files == null ? '–' : u.files.toLocaleString()}</td>
      <td>${fmtDelta(u.d1)}</td><td>${fmtDelta(u.d7)}</td><td>${fmtDelta(u.d30)}</td></tr>`).join('') +
    `</tbody><tfoot><tr><td>Total (${list.length})</td><td>${fmtBytes(total, 2)}</td><td>100%</td><td>${files ? files.toLocaleString() : '–'}</td><td colspan="3"></td></tr></tfoot></table>`;
  $('#userTbl').querySelectorAll('th').forEach(th => th.onclick = () => {
    const c = th.dataset.k === 'share' ? 'bytes' : th.dataset.k;
    state.sort = { key: c, dir: state.sort.key === c ? -state.sort.dir : (c === 'user' ? 1 : -1) };
    renderUsers(n, a);
  });
  document.querySelectorAll('#userTbl tbody tr[data-u], #ubody .hbar[data-u]').forEach(el => el.onclick = () => {
    state.user = el.dataset.u; renderUsers(n, a); renderUser(n, a);
    $('#userCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function renderUser(n, a) {
  const u = n.users[state.user], card = $('#userCard');
  const rng = rangeIdx(n);
  const pts = rng.map(o => ({ x: o.day, y: u.bytes[o.k], f: u.files[o.k] })).filter(p => p.y != null);
  card.hidden = false;
  const first = pts[0], end = pts[pts.length - 1];
  card.innerHTML = `<div class="phead"><div><h3>${esc(ulabel(state.user))} — day-wise usage</h3>
      <div class="sub">${end ? `Now ${fmtBytes(end.y, 2)} · ${fmtDelta(end.y - first.y)} over ${RANGES.find(r => r[0] === state.range)[1].toLowerCase()}` : 'No history in this period'}</div></div>
      <button class="btn small" id="userClose">Close</button></div>
    <div class="cols" style="margin-top:0"><div class="chart" id="userChart"></div><div class="tbl" style="max-height:300px" id="userDayTbl"></div></div>`;
  lineChart($('#userChart'), {
    series: [{ name: state.user, color: a.c, points: pts }], bytes: true, area: true, height: 260, markers: pts.length <= 45,
    yFmt: v => fmtBytes(v), tipFmt: p => `${fmtBytes(p.y, 2)}${p.f == null ? '' : ' · ' + p.f.toLocaleString() + ' files'}`,
  });
  const rows = [...pts].reverse();
  $('#userDayTbl').innerHTML = `<table><thead><tr><th>Date</th><th>Size</th><th>Files</th><th>Change</th></tr></thead><tbody>` +
    rows.map((r, k) => `<tr><td>${fmtDateLong(r.x)}</td><td>${fmtBytes(r.y, 2)}</td><td>${r.f == null ? '–' : r.f.toLocaleString()}</td><td>${fmtDelta(rows[k + 1] ? r.y - rows[k + 1].y : null)}</td></tr>`).join('') + '</tbody></table>';
  $('#userClose').onclick = () => { state.user = null; card.hidden = true; renderUsers(n, a); };
}

/* ---------- routing ---------- */
function render() {
  if (!state.data) return;
  const m = location.hash.match(/^#\/nas\/(.+)$/);
  if (m) renderModule(decodeURIComponent(m[1])); else renderLanding();
}
addEventListener('hashchange', () => { state.user = null; state.day = null; render(); scrollTo(0, 0); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });

async function load() {
  const r = await fetch('data.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('data.json: HTTP ' + r.status);
  const data = await r.json();
  await applySources(data);
  state.data = data;
  render();
}
load().catch(e => { $('#app').innerHTML = `<div class="empty">Could not load data (${esc(e.message)}).</div>`; });
setInterval(() => load().catch(() => {}), 10 * 60 * 1000);
</script>
</body>
